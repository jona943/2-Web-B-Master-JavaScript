<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Comentarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Caja de comentarios</h1>
    <div id="caja-comentario">
        <h2>Escribe tu comentario:</h2>
        <textarea name="textarea" id="name" placeholder="Escribe tu nombre"></textarea>
        <textarea name="textarea" id="comentario" placeholder="Escribe tu comentario"></textarea>
        <button id="enviar">Enviar</button>
    </div>
    <!-- He colocado un id commentUser -->
    <div id="commentUser">
        <h2>Comentarios:</h2>
    </div> 
    <script src="caja_comentarios.js"></script>
</body>
</html>
