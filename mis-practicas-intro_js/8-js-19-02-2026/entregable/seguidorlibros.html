<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="contentApp">
            <h1 id="title">Libros más Leídos</h1>
            <section id="contentFunction">

                <article id="libro1">
                    <h2>Deja de ser tú - Joe Dispenza</h2>
                    <img src="img/Deja_de_ser_tu.jpeg" alt="Portada del libro Deja de ser tú">
                    <div class="crearComentarios">
                        <h3>Reseñas del libro: </h3>
                        <textarea class="nuevoComentario" placeholder="Escribe tu reseña aquí..."></textarea>
                        <button class="enviarComentario">Enviar</button>
                        <div class="comentariosPublicados"></div>
                    </div>
                </article>

                <article id="libro2">
                    <h2>La Inteligencia Emocional - Daniel Goleman</h2>
                    <img src="img/La_Inteligencia_Emocional.png" alt="Portada del libro La Inteligencia Emocional">
                    <div class="crearComentarios">
                        <h3>Reseñas del libro: </h3>
                        <textarea class="nuevoComentario" placeholder="Escribe tu reseña aquí..."></textarea>
                        <button class="enviarComentario">Enviar</button>
                        <div class="comentariosPublicados"></div>
                    </div>
                </article>

                <article id="libro3">
                    <h2>Los cuatro acuerdos - Miguel Ruiz</h2>
                    <img src="img/Los_cuatro_acuerdos.jpeg" alt="Portada del libro Los cuatro acuerdos">
                    <div class="crearComentarios">
                        <h3>Reseñas del libro: </h3>
                        <textarea class="nuevoComentario" placeholder="Escribe tu reseña aquí..."></textarea>
                        <button class="enviarComentario">Enviar</button>
                        <div class="comentariosPublicados"></div>
                    </div>
                </article>

            </section>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
