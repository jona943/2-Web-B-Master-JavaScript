<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="contentApp">
            <h1 id="title">Libros más Leídos</h1>

            <!-- Sección de libros -->
            <section id="contentFunction">
                <article class="libro-card">
                    <img src="img/Deja_de_ser_tu.jpeg" alt="Portada del libro Deja de ser tú">
                    <h2>Deja de ser tú</h2>
                    <p>Joe Dispenza</p>
                </article>

                <article class="libro-card">
                    <img src="img/La_Inteligencia_Emocional.png" alt="Portada del libro La Inteligencia Emocional">
                    <h2>La Inteligencia Emocional</h2>
                    <p>Daniel Goleman</p>
                </article>

                <article class="libro-card">
                    <img src="img/Los_cuatro_acuerdos.jpeg" alt="Portada del libro Los cuatro acuerdos">
                    <h2>Los cuatro acuerdos</h2>
                    <p>Miguel Ruiz</p>
                </article>
            </section>

            <!-- Sección de reseñas unificada -->
            <section id="seccionResenas">
                <div id="crearComentarios">
                    <h3>Deja tu reseña:</h3>
                    
                    <input type="text" id="nombreUsuario" placeholder="Tu nombre">
                    
                    <div class="selector-libro">
                        <label for="libroSeleccionado">Selecciona un libro:</label>
                        <select id="libroSeleccionado">
                            <option value="Deja de ser tú">Deja de ser tú - Joe Dispenza</option>
                            <option value="La Inteligencia Emocional">La Inteligencia Emocional - Daniel Goleman</option>
                            <option value="Los cuatro acuerdos">Los cuatro acuerdos - Miguel Ruiz</option>
                        </select>
                    </div>

                    <textarea id="nuevoComentario" placeholder="¿Qué te parecieron estos libros?"></textarea>
                    <button id="enviarComentario">Publicar Reseña</button>
                </div>

                <div id="comentariosPublicados">
                    <h3>Reseñas de la comunidad</h3>
                    <p id="mensajeVacio">Sé el primero en escribir una reseña.</p>
                </div>
            </section>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
