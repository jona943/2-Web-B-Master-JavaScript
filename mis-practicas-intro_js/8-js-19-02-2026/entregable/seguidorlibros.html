<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="contentApp">
            <h1 id="title">Libros más Leídos</h1>
            
            <!-- Sección de libros en Grid -->
            <section id="contentFunction">
                <article class="libro-card" id="libro1">
                    <img src="img/Deja_de_ser_tu.jpeg" alt="Portada del libro Deja de ser tú">
                    <h2>Deja de ser tú</h2>
                    <p>Joe Dispenza</p>
                </article>

                <article class="libro-card" id="libro2">
                    <img src="img/La_Inteligencia_Emocional.png" alt="Portada del libro La Inteligencia Emocional">
                    <h2>La Inteligencia Emocional</h2>
                    <p>Daniel Goleman</p>
                </article>

                <article class="libro-card" id="libro3">
                    <img src="img/Los_cuatro_acuerdos.jpeg" alt="Portada del libro Los cuatro acuerdos">
                    <h2>Los cuatro acuerdos</h2>
                    <p>Miguel Ruiz</p>
                </article>
            </section>

            <!-- Sección de comentarios unificada -->
            <section id="seccionResenas">
                <div id="crearComentarios">
                    <h3>Deja tu reseña general:</h3>
                    <textarea id="nuevoComentario" placeholder="¿Qué te parecieron estos libros?"></textarea>
                    <button id="enviarComentario">Publicar Reseña</button>
                </div>
                <div id="comentariosPublicados">
                    <!-- Aquí se cargarán los comentarios con JS -->
                </div>
            </section>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
