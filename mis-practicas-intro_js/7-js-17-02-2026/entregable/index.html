<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de contraseñas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="menu">
        <div id="titulo">
            <h2>Password Generator</h2>
        </div>

        <section id="newPassword">
            <span id="passwordText">P4$sw0rd!</span>
            <div class="copiar">
                <span class="icono-copiar"></span>
            </div>
        </section>

        <div id="contenedor-aplicacion">


          <div id="subContenedor">
            <section id="contenedor-Long">
                <div class="Longitud">
                    <h4>Longitud de caracteres</h4>
                    <div id="valorLongitud" class="numCaracter">10</div>
                </div>
                <div class="longitud-caracter">
                    <input type="range" id="longitudSlider" min="1" max="20" value="10">
                </div>
            </section>


            <h3>Seleccione los caracteres</h3>
            <ul class="seccion1">
                <li>
                    <input type="checkbox" id="minusculas" checked>
                    <label for="minusculas">Incluir Letras Minusculas</label>
                </li>
                <li>
                    <input type="checkbox" id="mayusculas">
                    <label for="mayusculas">Incluir Letras Mayusculas</label>
                </li>
                <li>
                    <input type="checkbox" id="numeros">
                    <label for="numeros">Incluir Numeros</label>
                </li>
                <li>
                    <input type="checkbox" id="simbolos">
                    <label for="simbolos">Incluir Simbolos</label>
                </li>
            </ul>


            <div class="calificacion-password">
                <h4>Dificultad</h4>
                <div id="nivelDificultad" class="grafica">MEDIA</div>
            </div>

            <div class="boton">
                <button id="btnGenerar">Generar </button>
            </div>
            
          </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
