<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Master Playground | Visor de Prácticas</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body>

  <!-- Header Superior -->
  <header>
    <div class="brand">
      <div class="brand-icon">JS</div>
      <span>Master Playground</span>
    </div>
    
    <div class="badge-beca">
      <i data-lucide="award" size="14"></i>
      <span>DEV.F x Traxión Tech Challenge 2025</span>
    </div>
  </header>

  <!-- Layout Principal -->
  <div class="app-container">
    
    <!-- Sidebar de Navegación -->
    <sidebar>
      <div class="sidebar-header">
        <div class="sidebar-title">Prácticas de JavaScript</div>
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar lección o entregable...">
      </div>

      <div class="lessons-list" id="lessonsContainer">
        <!-- Generado dinámicamente mediante JS -->
      </div>
    </sidebar>

    <!-- Simulación de Navegador -->
    <main>
      <div class="browser-window">
        <!-- Toolbar estilo navegador -->
        <div class="browser-toolbar">
          <div class="window-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>

          <div class="nav-btns">
            <button class="nav-btn" title="Atrás"><i data-lucide="arrow-left" size="16"></i></button>
            <button class="nav-btn" title="Adelante"><i data-lucide="arrow-right" size="16"></i></button>
            <button class="nav-btn" id="reloadBtn" title="Recargar"><i data-lucide="rotate-cw" size="16"></i></button>
          </div>

          <div class="address-bar">
            <i data-lucide="lock" size="12" style="color: #10b981;"></i>
            <span class="address-text" id="addressUrl">http://localhost/1-Web-Master-JS/...</span>
          </div>

          <a id="externalLink" href="#" target="_blank" class="external-link-btn" title="Abrir en pestaña independiente">
            <span>Pestaña nueva</span>
            <i data-lucide="external-link" size="14"></i>
          </a>
        </div>

        <!-- Visor del Proyecto / Iframe -->
        <div class="viewport">
          <iframe id="previewIframe" src="about:blank"></iframe>
        </div>

        <!-- Footer Informativo -->
        <div class="info-footer">
          <span id="lessonObjective">Selecciona una práctica del menú lateral</span>
          <span id="lessonDate">Módulo 1</span>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Datos de todas las lecciones y entregables registrados
    const lessonsData = [
      {
        title: "Lección 1: Sintaxis y Variables",
        date: "27-01-2025",
        url: "mis-practicas-intro_js/1-js-27-01-2025/index.html",
        objective: "Fundamentos iniciales de sintaxis, variables y métodos en consola.",
        tag: "js"
      },
      {
        title: "Lección 2: Operadores y Entrada",
        date: "29-01-2025",
        url: "mis-practicas-intro_js/2-js-29-01-2025/index.html",
        objective: "Captura de datos mediante prompt() y evaluación de expresiones.",
        tag: "js"
      },
      {
        title: "Lección 2: Entregable - Evaluador de Notas",
        date: "29-01-2025",
        url: "mis-practicas-intro_js/2-js-29-01-2025/entregable/evaliador.html",
        objective: "Entregable interactivo para evaluación y calificación de notas.",
        tag: "project"
      },
      {
        title: "Lección 3: Estructuras y Bucles",
        date: "03-02-2026",
        url: "mis-practicas-intro_js/3-js-03-02-2026/index.html",
        objective: "Ejercicios de ciclos iterativos (for, while) y contadores.",
        tag: "js"
      },
      {
        title: "Lección 6: Objetos y Estructura",
        date: "12-02-2026",
        url: "mis-practicas-intro_js/6-js-12-02-2026/index.html",
        objective: "Definición y propiedades de objetos literales.",
        tag: "html"
      },
      {
        title: "Lección 6: Entregable - Caja de Comentarios",
        date: "12-02-2026",
        url: "mis-practicas-intro_js/6-js-12-02-2026/entregable/index.html",
        objective: "Componente interactivo para agregar y mostrar comentarios.",
        tag: "project"
      },
      {
        title: "Lección 7: Introducción al DOM",
        date: "17-02-2026",
        url: "mis-practicas-intro_js/7-js-17-02-2026/index.html",
        objective: "Selección dinámica de nodos y modificación de estilos.",
        tag: "html"
      },
      {
        title: "Lección 7: Entregable - Interacción DOM",
        date: "17-02-2026",
        url: "mis-practicas-intro_js/7-js-17-02-2026/entregable/index.html",
        objective: "Entregable para gestión de elementos y actualización en vivo del DOM.",
        tag: "project"
      },
      {
        title: "Lección 8: Eventos y Estilos",
        date: "19-02-2026",
        url: "mis-practicas-intro_js/8-js-19-02-2026/index.html",
        objective: "Manejo avanzado de eventos de usuario e interactividad.",
        tag: "html"
      },
      {
        title: "Lección 8: Entregable - Seguidor de Libros",
        date: "19-02-2026",
        url: "mis-practicas-intro_js/8-js-19-02-2026/entregable/seguidorlibros.html",
        objective: "Proyecto final del módulo: Rastreador e historia de lecturas.",
        tag: "project"
      }
    ];

    // Elementos del DOM
    const container = document.getElementById('lessonsContainer');
    const searchInput = document.getElementById('searchInput');
    const iframe = document.getElementById('previewIframe');
    const addressUrl = document.getElementById('addressUrl');
    const externalLink = document.getElementById('externalLink');
    const reloadBtn = document.getElementById('reloadBtn');
    const lessonObjective = document.getElementById('lessonObjective');
    const lessonDate = document.getElementById('lessonDate');

    // Renderizar lista de lecciones
    function renderLessons(filter = '') {
      container.innerHTML = '';
      
      const filtered = lessonsData.filter(item => 
        item.title.toLowerCase().includes(filter.toLowerCase()) ||
        item.objective.toLowerCase().includes(filter.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 16px; color: var(--text-muted); font-size: 0.85rem; text-align: center;">No se encontraron lecciones</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `lesson-item ${index === 0 && !filter ? 'active' : ''}`;
        
        let tagClass = 'tag-js';
        let tagText = 'JS';
        if (item.tag === 'project') { tagClass = 'tag-project'; tagText = 'PROYECTO'; }
        if (item.tag === 'html') { tagClass = 'tag-html'; tagText = 'HTML'; }

        div.innerHTML = `
          <i data-lucide="${item.tag === 'project' ? 'folder-check' : 'code'}" size="16"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.title}</span>
          <span class="item-tag ${tagClass}">${tagText}</span>
        `;

        div.addEventListener('click', () => {
          document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          loadLesson(item);
        });

        container.appendChild(div);
      });

      // Inicializar iconos de Lucide
      lucide.createIcons();
    }

    // Cargar lección en el simulador
    function loadLesson(item) {
      iframe.src = item.url;
      addressUrl.textContent = `http://localhost/1-Web-Master-JS/${item.url}`;
      externalLink.href = item.url;
      lessonObjective.textContent = item.objective;
      lessonDate.textContent = `Fecha: ${item.date}`;
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => renderLessons(e.target.value));
    reloadBtn.addEventListener('click', () => {
      iframe.contentWindow.location.reload();
    });

    // Inicialización al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      renderLessons();
      if (lessonsData.length > 0) {
        loadLesson(lessonsData[lessonsData.length - 1]); // Cargar el proyecto más reciente por defecto
      }
    });
  </script>
</body>
</html>
